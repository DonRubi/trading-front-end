<script>
        const API_BASE_URL = 'https://kuba-quant-desk.onrender.com';
        let isPrivacyMode = false;
        
        let tickerDataArray = [], currentTickerPage = 1, tickerPageSize = 20;
        let formEntries = [], filteredFormEntries = [], formCurrentPage = 1, formRowsPerPage = 6, formFilterText = '';
        let focusDataArray = [], currentFocusPage = 1, focusPageSize = 20, formEntriesGlobal = [];
        let allTradesData = [], filteredTradesData = [], currentTradePage = 1, tradePageSize = 20;
        let allAlertsData = [], filteredAlertsData = [], currentAlertPage = 1, alertPageSize = 20;

        let currentEditContext = null;
        let currentEditId = null;
        
        let summaryOpenSortKey = 'valLev', summaryOpenSortDir = 'desc';
        let formSortKey = 'created_at', formSortDir = 'desc';
        let focusSortKey = 'id', focusSortDir = 'desc';
        let tradeSortKey = 'buy_date', tradeSortDir = 'desc';

        // --- LOCAL CACHING ---
        function getCachedData(key) {
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : null;
        }
        function setCachedData(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }

        // --- NAWIGACJA (TO BYŁO POWODEM AWARII) ---
        function openModule(moduleId, moduleTitle) {
            document.getElementById('dashboard').style.display = 'none';
            document.querySelectorAll('.app-module').forEach(m => m.style.display = 'none');
            document.getElementById(moduleId).style.display = 'block';
            document.getElementById('app-title').innerText = moduleTitle;
            document.getElementById('back-btn').style.display = 'flex';

            if (moduleId === 'database-module') { loadDatabase(); loadMacroData(); }
            if (moduleId === 'alerthistory-module') loadAlertHistory();
            if (moduleId === 'dailybrief-module') loadDailyBriefs();
            if (moduleId === 'form-module') initFormModule();
            if (moduleId === 'focus-module') initFocusModule();
            if (moduleId === 'tradeslist-module') initTradesModule();
            if (moduleId === 'summary-module') initSummaryModule();
            if (moduleId === 'service-module') loadServiceModule();
            if (moduleId === 'focuslist-module') initFocusListModule();
        }

        function openDashboard() {
            document.querySelectorAll('.app-module').forEach(m => m.style.display = 'none');
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('app-title').innerHTML = 'Quant<span>Desk</span>';
            document.getElementById('back-btn').style.display = 'none';
        }

        function togglePrivacy() {
            isPrivacyMode = !isPrivacyMode;
            document.getElementById('privacy-btn').innerText = isPrivacyMode ? '🙈' : '👁️';
            if (isPrivacyMode) document.body.classList.add('privacy-active');
            else document.body.classList.remove('privacy-active');
        }

        // --- SYSTEM GLOBALNEJ EDYCJI ---
        function openEditModal(context, id) {
            currentEditContext = context;
            currentEditId = id;
            const content = document.getElementById('edit-modal-content');
            content.innerHTML = '';
            
            if (context === 'ticker') {
                const item = tickerDataArray.find(x => x.ticker === id);
                document.getElementById('edit-modal-title').innerText = "Edycja Tickera";
                content.innerHTML = `
                    <div class="form-group"><label>Ticker (Pamiętaj o formacie!)</label><input type="text" id="edit-t-name" value="${item.ticker}" required></div>
                    <div class="form-group"><label>Cena z palca (lub zostaw API)</label><input type="number" step="0.01" id="edit-t-price" value="${item.price || ''}"></div>
                `;
            } else if (context === 'form') {
                const item = formEntries.find(x => x.entry_id === id);
                document.getElementById('edit-modal-title').innerText = "Edycja Form (Kaskadowa)";
                content.innerHTML = `
                    <p style="font-size:12px; color:var(--danger); margin-bottom:10px;">Zmiana Tickera lub Początku Strefy wygeneruje nowe ID i zaktualizuje powiązane pozycje Focus/Trades!</p>
                    <div class="form-group"><label>Ticker</label><input type="text" id="edit-f-ticker" value="${item.ticker}" required></div>
                    <div class="form-row">
                        <div class="form-group"><label>Start strefy</label><input type="number" step="0.01" id="edit-f-start" value="${item.start_zone}" required></div>
                        <div class="form-group"><label>Koniec (SL)</label><input type="number" step="0.01" id="edit-f-end" value="${item.end_zone}" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Wejście</label><input type="number" step="0.01" id="edit-f-entry" value="${item.entry_point}"></div>
                        <div class="form-group"><label>Take Profit</label><input type="number" step="0.01" id="edit-f-tp" value="${item.take_profit}"></div>
                    </div>
                `;
            } else if (context === 'focus') {
                const item = focusDataArray.find(x => x.id === id);
                document.getElementById('edit-modal-title').innerText = "Edycja Focus";
                content.innerHTML = `
                    <div class="form-row">
                        <div class="form-group"><label>Alokacja %</label><input type="number" step="0.1" id="edit-fo-pct" value="${item.allocated_pct}"></div>
                        <div class="form-group"><label>Rozmiar ($)</label><input type="number" step="0.1" id="edit-fo-cash" value="${item.allocated_cash}"></div>
                    </div>
                `;
            } else if (context === 'trade') {
                const item = allTradesData.find(x => x.id === id);
                document.getElementById('edit-modal-title').innerText = "Edycja Transakcji";
                content.innerHTML = `
                    <div class="form-row">
                        <div class="form-group"><label>Cena Zakupu</label><input type="number" step="0.0001" id="edit-tr-buy" value="${item.buy_price}"></div>
                        <div class="form-group"><label>Wydano Gotówki</label><input type="number" step="0.01" id="edit-tr-spent" value="${item.spent}"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Take Profit</label><input type="number" step="0.01" id="edit-tr-tp" value="${item.tp}"></div>
                        <div class="form-group"><label>Stop Loss</label><input type="number" step="0.01" id="edit-tr-sl" value="${item.sl}"></div>
                    </div>
                `;
            }
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }

        async function submitEditForm(e) {
            e.preventDefault();
            let payload = {}; let endpoint = '';
            
            if (currentEditContext === 'ticker') {
                endpoint = '/api/database/edit';
                payload = { old_ticker: currentEditId, ticker: document.getElementById('edit-t-name').value, price: document.getElementById('edit-t-price').value };
            } else if (currentEditContext === 'form') {
                endpoint = '/api/form/edit';
                payload = { old_entry_id: currentEditId, ticker: document.getElementById('edit-f-ticker').value, start_zone: document.getElementById('edit-f-start').value, end_zone: document.getElementById('edit-f-end').value, entry_point: document.getElementById('edit-f-entry').value, take_profit: document.getElementById('edit-f-tp').value, stop_loss: document.getElementById('edit-f-end').value };
            } else if (currentEditContext === 'focus') {
                endpoint = '/api/focus/edit';
                payload = { id: currentEditId, allocated_pct: document.getElementById('edit-fo-pct').value, allocated_cash: document.getElementById('edit-fo-cash').value };
            } else if (currentEditContext === 'trade') {
                endpoint = '/api/trades/edit';
                payload = { id: currentEditId, buy_price: document.getElementById('edit-tr-buy').value, spent: document.getElementById('edit-tr-spent').value, tp: document.getElementById('edit-tr-tp').value, sl: document.getElementById('edit-tr-sl').value };
            }

            try {
                const res = await fetch(`${API_BASE_URL}${endpoint}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                if(res.ok) {
                    closeEditModal(); alert('Zaktualizowano pomyślnie!');
                    if(currentEditContext === 'ticker') loadDatabase();
                    if(currentEditContext === 'form') fetchFormEntries();
                    if(currentEditContext === 'focus') fetchFocusEntries();
                    if(currentEditContext === 'trade') fetchTradesEntries();
                } else alert('Błąd aktualizacji bazy.');
            } catch(err) { console.error(err); }
        }

        // --- BAZA I MAKRO ---
        let macroDataArray = [], currentMacroPage = 1, macroPageSize = 10;
        let depositsDataArray = [];

        function loadMacroData() {
            const tbody = document.getElementById('macro-table-body');
            if (!tbody) return;
            fetch(`${API_BASE_URL}/api/macro/history`).then(r => r.json()).then(data => { macroDataArray = Array.isArray(data) ? data : []; currentMacroPage = 1; renderMacroTable(); }).catch(e => {});
        }

        function renderMacroTable() {
            const tbody = document.getElementById('macro-table-body');
            if (macroDataArray.length === 0) { tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px; color: #777;">Brak wpisów makro w bazie.</td></tr>`; return; }
            const totalPages = Math.ceil(macroDataArray.length / macroPageSize);
            const start = (currentMacroPage - 1) * macroPageSize;
            tbody.innerHTML = macroDataArray.slice(start, start + macroPageSize).map(row => `<tr><td class="macro-val-date">${row.date || '-'}</td><td class="macro-val-currency sensitive">${row.eurpln || '-'}</td><td class="macro-val-currency sensitive">${row.usdpln || '-'}</td><td class="macro-val-vix">${row.vix || '-'}</td><td style="font-weight: 500;" class="sensitive">${row.sp500 || '-'}</td><td class="macro-val-time">${row.updated_at || '-'}</td></tr>`).join('');
            document.getElementById('macro-page-info').innerText = `Strona ${currentMacroPage} z ${totalPages}`;
        }

        function changeMacroPage(dir) { currentMacroPage += dir; renderMacroTable(); }
        async function forceMacroUpdate() { try { await fetch(`${API_BASE_URL}/api/macro/force`, { method: 'POST' }); alert("Zaktualizowano makro"); loadMacroData(); } catch (e) { alert("Błąd połączenia z serwerem."); } }
        async function forceMacroYTDUpdate(event) { 
            let btn = null; let originalText = "📥 Pobierz YTD";
            if(event && event.currentTarget) { btn = event.currentTarget; originalText = btn.innerText; btn.innerText = "⏳ Pobieram YTD (to potrwa 10-20s)..."; btn.disabled = true; }
            try { 
                const res = await fetch(`${API_BASE_URL}/api/macro/backfill-ytd`, { method: 'POST' }); 
                const data = await res.json();
                if(res.ok) { alert(data.message); loadMacroData(); } else { alert("Wystąpił błąd: " + data.message); }
            } catch (e) { alert("Błąd połączenia z serwerem."); } 
            finally { if(btn) { btn.innerText = originalText; btn.disabled = false; } }
        }

        async function loadDatabase() { try { const response = await fetch(`${API_BASE_URL}/api/database`); const dt = await response.json(); tickerDataArray = Array.isArray(dt) ? dt : []; renderMobileList(); } catch (e) {} }
        function renderMobileList() {
            const container = document.getElementById('db-list-container'); container.innerHTML = ''; if (tickerDataArray.length === 0) return;
            const start = (currentTickerPage - 1) * tickerPageSize;
            container.innerHTML = tickerDataArray.slice(start, start + tickerPageSize).map((item) => `<div class="data-card"><div class="data-card-info"><h4>${item.ticker}</h4><p>${item.date_added ? new Date(item.date_added).toLocaleDateString('pl-PL') : '-'}</p></div><div style="display: flex; gap:5px;"><span class="price-tag sensitive">${item.price !== null ? item.price + '$' : '...'}</span><button class="btn-edit" onclick="openEditModal('ticker', '${item.ticker}')">Edytuj</button><button class="btn-delete" onclick="removeTicker('${item.ticker}')">Usuń</button></div></div>`).join('');
            document.getElementById('ticker-page-info').innerText = currentTickerPage;
        }
        function changeTickerPage(dir) { currentTickerPage += dir; renderMobileList(); }
        async function addTicker() { const t = document.getElementById('new-ticker').value.trim().toUpperCase(); if (!t) return; try { await fetch(`${API_BASE_URL}/api/database/add`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ticker: t }) }); document.getElementById('new-ticker').value = ''; loadDatabase(); } catch (e) {} }
        async function removeTicker(t) { if (!confirm('Usunąć?')) return; try { await fetch(`${API_BASE_URL}/api/database/delete`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ticker: t }) }); loadDatabase(); } catch (e) {} }

        // --- FORM MODULE ---
        function handleFormSort(key) {
            formSortDir = (formSortKey === key && formSortDir === 'desc') ? 'asc' : 'desc';
            formSortKey = key;
            applyFormFilterAndSort();
        }

        async function initFormModule() { if(tickerDataArray.length === 0) await loadDatabase(); const select = document.getElementById('form-ticker'); select.innerHTML = ''; tickerDataArray.forEach(t => { select.innerHTML += `<option value="${t.ticker}">${t.ticker}</option>`; }); fetchFormEntries(); }
        
        async function fetchFormEntries() { 
            const cached = getCachedData('form_cache');
            if(cached) { formEntries = cached; applyFormFilterAndSort(); }
            try { 
                const response = await fetch(`${API_BASE_URL}/api/form/entries`); 
                const rawData = await response.json(); 
                formEntries = Array.isArray(rawData) ? rawData : []; 
                setCachedData('form_cache', formEntries);
                applyFormFilterAndSort(); 
            } catch (error) { console.error(error); } 
        }
        
        function handleFormFilter() { formFilterText = document.getElementById('journal-search').value.toLowerCase(); formCurrentPage = 1; applyFormFilterAndSort(); }
        
        function applyFormFilterAndSort() {
            const muteFilter = document.getElementById('form-mute-filter').value;
            filteredFormEntries = formEntries.filter(entry => {
                const textMatch = (entry.ticker || '').toLowerCase().includes(formFilterText);
                let muteMatch = true;
                if (muteFilter !== 'ALL') muteMatch = (entry.mute.toString() === muteFilter);
                return textMatch && muteMatch;
            });

            filteredFormEntries.sort((a, b) => {
                let va=a[formSortKey], vb=b[formSortKey];
                if(typeof va === 'string') { return formSortDir==='asc' ? va.localeCompare(vb) : vb.localeCompare(va); }
                return formSortDir==='asc' ? va-vb : vb-va;
            });

            renderAdvancedFormTable();
        }

        function renderAdvancedFormTable() {
            const tbody = document.getElementById('form-table-body'); tbody.innerHTML = '';
            const items = filteredFormEntries.slice((formCurrentPage - 1) * formRowsPerPage, formCurrentPage * formRowsPerPage);
            items.forEach(item => {
                const dateFormatted = item.created_at ? new Date(item.created_at).toLocaleDateString('pl-PL') : '-';
                const isLong = (item.direction === 'DBR' || item.direction === 'RBR'); const mod = isLong ? 1 : -1;
                const entry = parseFloat(item.entry_point); const sl = parseFloat(item.stop_loss); const tp = parseFloat(item.take_profit);
                let rr = (entry - sl !== 0) ? ((tp - entry) * mod) / ((entry - sl) * mod) : 0;
                
                const tm = tickerDataArray.find(t => t.ticker === item.ticker); 
                const cp = tm && tm.price ? tm.price : entry; 
                
                // Rzeczywisty Dystans Cenowy (ujemny/dodatni)
                const rawDiff = ((cp - entry) / entry) * 100 * mod;
                
                // Status opiera się na bezwzględnej wielkości ruchu (dystans)
                const absDiff = Math.abs(rawDiff);
                let status = absDiff > 15 ? 'Ignorowanie' : (absDiff > 10 ? 'Czekanie' : (item.priority === 1 ? 'Skupienie' : 'Obserwacja'));
                let statusColor = absDiff > 15 ? '#f6465d' : (absDiff > 10 ? '#fcd535' : (item.priority === 1 ? '#0ecb81' : '#848e9c'));
                
                let diffColor = rawDiff >= 0 ? '#0ecb81' : '#f6465d';
                let diffStr = (rawDiff > 0 ? '+' : '') + rawDiff.toFixed(2) + '%';
                
                const tvLink = getTradingViewLink(item.ticker); 
                const muteVal = item.mute !== undefined && item.mute !== null ? item.mute : 1;
                const pb = item.priority === 1 ? `<span style="color: #fcd535; font-weight: bold; cursor: pointer; border-bottom: 1px dashed #fcd535;" onclick="updateFormEntryField('${item.entry_id}', 'priority', 0)">⚡ Wysoki</span>` : `<span style="color: var(--text-muted); cursor: pointer; border-bottom: 1px dashed var(--text-muted);" onclick="updateFormEntryField('${item.entry_id}', 'priority', 1)">Normalny</span>`;
                const mb = muteVal === 1 ? `<span style="color: var(--danger); font-weight: bold; cursor: pointer; border-bottom: 1px dashed var(--danger);" onclick="updateFormEntryField('${item.entry_id}', 'mute', 0)">🔕 Tak</span>` : `<span style="color: var(--success); font-weight: bold; cursor: pointer; border-bottom: 1px dashed var(--success);" onclick="updateFormEntryField('${item.entry_id}', 'mute', 1)">🔔 Nie</span>`;

                const cpDisplay = tm && tm.price ? `<br><small style="color:#eaecef;">Akt: ${tm.price.toFixed(2)}$</small>` : `<br><small style="color:var(--text-muted);">Akt: Brak</small>`;

                tbody.innerHTML += `<tr>
                    <td style="font-weight:bold;">${item.entry_id}</td>
                    <td style="color:var(--text-muted);">${dateFormatted}</td>
                    <td><strong style="color:var(--accent);">${item.ticker}</strong></td>
                    <td><span style="font-size:0.85em; color:var(--text-muted);">${item.direction}</span><br><small>${item.start_zone} - ${item.end_zone}</small></td>
                    <td class="sensitive" style="font-weight: 600;">WE: ${entry.toFixed(2)}$</td>
                    <td>${pb}</td><td>${mb}</td>
                    <td style="color:${statusColor}; font-weight:bold;">${status}</td>
                    <td class="sensitive" style="color:${diffColor}; font-weight:bold;">${diffStr}</td>
                    <td class="sensitive">${rr.toFixed(2)}</td><td style="font-weight:bold; color:#a6e3a1;">${item.score}/5</td>
                    <td><a href="${tvLink}" target="_blank" style="text-decoration:none; color:var(--accent);">📈 Link</a> <button class="btn-edit" onclick="openEditModal('form', '${item.entry_id}')">✎</button> <button class="btn-delete" onclick="deleteAdvancedFormEntry('${item.entry_id}')" style="padding: 3px 8px;">Usuń</button></td>
                </tr>`;
            });
            document.getElementById('form-page-info').innerText = `Strona ${formCurrentPage}`;
        }
        function changeFormPage(d) { formCurrentPage += d; renderAdvancedFormTable(); }
        async function submitAdvancedForm(e) { e.preventDefault(); const data = { ticker: document.getElementById('form-ticker').value, direction: document.getElementById('form-direction').value, priority: document.getElementById('form-priority').value, start_zone: document.getElementById('form-start').value, end_zone: document.getElementById('form-end').value, entry_point: document.getElementById('form-entry').value, take_profit: document.getElementById('form-tp').value }; try { await fetch(`${API_BASE_URL}/api/form/add`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) }); document.getElementById('trading-form').reset(); fetchFormEntries(); } catch(err) {} }
        async function deleteAdvancedFormEntry(id) { if(!confirm('Usunąć?')) return; try { await fetch(`${API_BASE_URL}/api/form/delete`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: id}) }); fetchFormEntries(); } catch(e) {} }
        async function updateFormEntryField(id, field, val) { try { await fetch(`${API_BASE_URL}/api/form/update`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ entry_id: id, field: field, value: val }) }); fetchFormEntries(); } catch(e){} }

        // --- ASYSTENT FIBO ---
        function toggleFibo() { const drawer = document.getElementById('fibo-drawer'); drawer.style.display = drawer.style.display === 'block' ? 'none' : 'block'; if (drawer.style.display === 'block') updateFiboLabels(); }
        function updateFiboLabels() {
            const start = parseFloat(document.getElementById('fibo-start').value); const peak = parseFloat(document.getElementById('fibo-peak').value); const direction = document.getElementById('form-direction').value; const select = document.getElementById('fibo-level');
            if (!select) return; const levels = [1.272, 1.618, 2.000, 2.618]; const currentSelected = select.value; select.innerHTML = ''; 
            levels.forEach(lvl => {
                let optionText = lvl.toFixed(3);
                if (!isNaN(start) && !isNaN(peak)) { let calculatedPrice = (direction === 'DBR' || direction === 'RBR') ? peak + (peak - start) * lvl : peak - (start - peak) * lvl; optionText += ` (cena: ${calculatedPrice.toFixed(2)})`; }
                const opt = document.createElement('option'); opt.value = lvl.toString(); opt.textContent = optionText; if (lvl.toString() === currentSelected) opt.selected = true; select.appendChild(opt);
            });
        }
        function applyFibo() {
            const start = parseFloat(document.getElementById('fibo-start').value); const peak = parseFloat(document.getElementById('fibo-peak').value); const level = parseFloat(document.getElementById('fibo-level').value); const direction = document.getElementById('form-direction').value;
            if(isNaN(start) || isNaN(peak)) return alert('Podaj poprawne wartości dla początku i szczytu trendu.');
            const tp = (direction === 'DBR' || direction === 'RBR') ? peak + (peak - start) * level : peak - (start - peak) * level; document.getElementById('form-tp').value = tp.toFixed(2); toggleFibo();
        }
        function updateFormTvLink() { const ticker = document.getElementById('form-ticker').value; const linkEl = document.getElementById('form-tv-link'); if (ticker) { linkEl.href = getTradingViewLink(ticker); linkEl.style.display = 'inline-block'; } }

        // --- FOCUS MODULE ---
        function handleFocusSort(key) { focusSortDir = (focusSortKey === key && focusSortDir === 'desc') ? 'asc' : 'desc'; focusSortKey = key; renderFocusTable(); }

        async function initFocusModule() { try { const res = await fetch(`${API_BASE_URL}/api/form/entries`); formEntriesGlobal = await res.json(); document.getElementById('focus-form-id').innerHTML = formEntriesGlobal.map(e => `<option value="${e.entry_id}">${e.entry_id} (${e.ticker})</option>`).join(''); onFocusIdChange(); fetchFocusEntries(); } catch(e) {} }
        function onFocusIdChange() { const entry = formEntriesGlobal.find(e => e.entry_id === document.getElementById('focus-form-id').value); if(entry) { document.getElementById('focus-ticker').value = entry.ticker; document.getElementById('focus-direction').value = entry.direction; } }
        async function autoCalculateSMC() { const t = document.getElementById('focus-ticker').value; const d = document.getElementById('focus-direction').value; try { const res = await fetch(`${API_BASE_URL}/api/focus/calculate-automation`,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ticker:t, direction:d}) }); const r = await res.json(); document.getElementById('focus-candle').value = r.candle_score; document.getElementById('focus-volume').value = r.volume_score; document.getElementById('focus-vix').value = r.vix_score; document.getElementById('focus-index').value = r.index_score; } catch(e) { console.error(e); } }

        async function fetchFocusEntries() { 
            const cached = getCachedData('focus_cache');
            if(cached) { focusDataArray = cached; handleFocusFilter(''); }
            try { 
                const r = await fetch(`${API_BASE_URL}/api/focus/entries`); 
                focusDataArray = await r.json(); 
                setCachedData('focus_cache', focusDataArray);
                handleFocusFilter(''); 
            } catch(e) { console.error(e); } 
        }

        let filteredFocusArray = [];
        function handleFocusFilter(text) {
            filteredFocusArray = focusDataArray.filter(i => (i.ticker||'').toLowerCase().includes(text.toLowerCase()));
            renderFocusTable();
        }

        function renderFocusTable() {
            const tb = document.getElementById('focus-table-body'); tb.innerHTML = '';
            
            filteredFocusArray.sort((a,b) => {
                let va=a[focusSortKey], vb=b[focusSortKey];
                if(typeof va === 'string') { return focusSortDir==='asc' ? va.localeCompare(vb) : vb.localeCompare(va); }
                return focusSortDir==='asc' ? va-vb : vb-va;
            });

            filteredFocusArray.slice((currentFocusPage-1)*focusPageSize, currentFocusPage*focusPageSize).forEach(i => {
                tb.innerHTML += `<tr><td>#${i.id}</td><td>${new Date(i.created_at).toLocaleDateString('pl-PL')}</td><td>${i.entry_id}</td><td>${i.ticker}</td><td>${Number(i.points_total).toFixed(1)}</td><td style="color:#0ecb81;">${(i.final_ratio*100).toFixed(0)}%</td><td class="sensitive" style="color:#89b4fa;">${i.allocated_pct.toFixed(1)}%</td><td class="sensitive">${i.allocated_cash} ${i.currency}</td><td><button class="btn-edit" onclick="openEditModal('focus', ${i.id})">✎</button><button class="btn-delete" onclick="deleteFocusEntry(${i.id})">✖</button></td></tr>`;
            });
            document.getElementById('focus-page-info').innerText = currentFocusPage;
        }
        function changeFocusPage(d) { currentFocusPage += d; renderFocusTable(); }

        function calculateAndRenderSummary() {
            if (!Array.isArray(depositsDataArray)) depositsDataArray = [];

            let totalDepositsPln = 0; depositsDataArray.forEach(d => totalDepositsPln += parseFloat(d.amount_pln || d.amount || 0));
            let totalClosedPnlPln = 0; let openInvestedPln = 0; let openProfitPln = 0; let openLevValuePln = 0; let openLevNominalPln = 0;
            const currBreakdown = { PLN: 0, USD: 0, EUR: 0 }; const openGrouped = {}; const monthSet = new Set();

            allTradesData.forEach(trade => {
                try {
                    const s = calculateTradeStats(trade); const curr = trade.currency || 'USD';
                    if (s.isClosed) {
                        totalClosedPnlPln += s.profPln;
                        let month = 'Brak daty'; if (trade.sell_date && trade.sell_date.length >= 7) month = trade.sell_date.substring(0, 7);
                        monthSet.add(month);
                    } else {
                        openInvestedPln += s.spentPln; openProfitPln += s.profPln; openLevValuePln += s.valPln + s.profPln; openLevNominalPln += s.valPln;
                        const spent = parseFloat(trade.spent) || 0; const valInCurr = spent + s.prof;
                        if(currBreakdown[curr] !== undefined) currBreakdown[curr] += valInCurr;
                        const ticker = trade.ticker || 'N/A';
                        if(!openGrouped[ticker]) openGrouped[ticker] = {inv:0, prof:0, valLev:0, curr: curr, invPln:0, valLevPln:0};
                        openGrouped[ticker].inv += spent; openGrouped[ticker].prof += s.prof; openGrouped[ticker].valLev += s.val + s.prof;
                        openGrouped[ticker].invPln += s.spentPln; openGrouped[ticker].valLevPln += s.valPln;
                    }
                } catch(err) {}
            });

            const currentCapitalPln = totalDepositsPln + totalClosedPnlPln;
            const freeCashPln = currentCapitalPln - openInvestedPln;
            const openPositionsValuePln = openInvestedPln + openProfitPln;
            const totalPortfolioValuePln = freeCashPln + openPositionsValuePln;
            
            let roiPct = 0; if (totalDepositsPln > 0) roiPct = ((totalPortfolioValuePln - totalDepositsPln) / totalDepositsPln) * 100;
            
            // Poprawiona logika (Zalewarowanie): Średnia dźwignia z otwartych pozycji

            document.getElementById('s-curr-breakdown').innerHTML = `<tr><td>PLN</td><td class="sensitive" style="font-weight:bold;">${currBreakdown.PLN.toFixed(2)} PLN</td></tr><tr><td>USD</td><td class="sensitive" style="font-weight:bold;">${currBreakdown.USD.toFixed(2)} USD</td></tr><tr><td>EUR</td><td class="sensitive" style="font-weight:bold;">${currBreakdown.EUR.toFixed(2)} EUR</td></tr>`;

            window.summaryOpenData = Object.keys(openGrouped).map(k => {
                const item = openGrouped[k]; item.ticker = k;
                item.pctInv = openInvestedPln > 0 ? (item.invPln / openInvestedPln) * 100 : 0;

        function calculateHarmonics(e) { e.preventDefault(); const x = parseFloat(document.getElementById('ha-x').value); const a = parseFloat(document.getElementById('ha-a').value); const b = parseFloat(document.getElementById('ha-b').value); const c = parseFloat(document.getElementById('ha-c').value); const xa = Math.abs(a - x); const ab = Math.abs(b - a); const bc = Math.abs(c - b); const isBullish = a > x; const dirMultiplier = isBullish ? -1 : 1; const bRetracement = ab / xa; const cRetracement = bc / ab; let resultsHTML = ''; const patterns = [ { name: 'Gartley', bTarget: 0.618, dRetXa: 0.786, dExtBcMin: 1.272, dExtBcMax: 1.618 }, { name: 'Bat', bTarget: 0.50, dRetXa: 0.886, dExtBcMin: 1.618, dExtBcMax: 2.618 }, { name: 'Butterfly', bTarget: 0.786, dRetXa: 1.272, dExtBcMin: 1.618, dExtBcMax: 2.618 }, { name: 'Crab', bTarget: 0.50, dRetXa: 1.618, dExtBcMin: 2.24, dExtBcMax: 3.618 }, { name: 'Deep Crab', bTarget: 0.886, dRetXa: 1.618, dExtBcMin: 2.24, dExtBcMax: 3.618 } ]; let foundMatch = false; patterns.forEach(pat => { const isBMatch = (Math.abs(bRetracement - pat.bTarget) <= 0.08) || (pat.name === 'Bat' && bRetracement >= 0.382 && bRetracement <= 0.52) || (pat.name === 'Crab' && bRetracement >= 0.382 && bRetracement <= 0.618); if(isBMatch) { foundMatch = true; const dTargetByXA = a + (xa * pat.dRetXa * dirMultiplier); const dTargetByBC_Min = c + (bc * pat.dExtBcMin * dirMultiplier); const dTargetByBC_Max = c + (bc * pat.dExtBcMax * dirMultiplier); resultsHTML += ` <div class="kpi-card" style="border-color: var(--accent);"> <h4 style="color:var(--accent); font-weight:bold; font-size:1.1em;">Zidentyfikowano: ${pat.name}</h4> <div style="font-size: 0.85em; color: var(--text-muted); margin-bottom:10px;"> Zniesienie B wynosi ${(bRetracement).toFixed(3)} XA (Oczekiwano ok. ${pat.bTarget})<br> Zniesienie C wynosi ${(cRetracement).toFixed(3)} AB </div> <div style="font-size: 0.9em; margin-bottom: 5px;">Idealny Punkt D (wzgl. XA): <b style="color:#fff;">${dTargetByXA.toFixed(2)}</b></div> <div style="font-size: 0.9em;">Strefa PRZ (wzgl. BC): <b style="color:var(--success);">${dTargetByBC_Min.toFixed(2)} - ${dTargetByBC_Max.toFixed(2)}</b></div> <div class="value sensitive" style="margin-top:10px; font-size:1.2rem; color:var(--accent);">Strefa Wejścia:<br>${Math.min(dTargetByXA, dTargetByBC_Min).toFixed(2)} do ${Math.max(dTargetByXA, dTargetByBC_Max).toFixed(2)}</div> </div> `; } }); if(!foundMatch) { resultsHTML = `<div style="grid-column: 1 / -1; color: var(--danger); text-align: center; padding: 20px; border: 1px dashed var(--danger); border-radius: 8px;"> Obecna struktura (B zniósł ${(bRetracement).toFixed(3)} XA, C zniósł ${(cRetracement).toFixed(3)} AB) nie mieści się w standardowych tolerancjach formacji Harmonicznych. To może być zwykła trójfalowa korekta. </div>`; } document.getElementById('ha-results').innerHTML = resultsHTML; }
        function calculateElliott(e) { e.preventDefault(); const dir = document.getElementById('ew-direction').value; const x = parseFloat(document.getElementById('ew-x').value); const w1 = parseFloat(document.getElementById('ew-1').value); const w2 = parseFloat(document.getElementById('ew-2').value); const w3 = parseFloat(document.getElementById('ew-3').value); const w4 = parseFloat(document.getElementById('ew-4').value); const isUp = dir === 'UP'; let score = 0; let maxScore = 5; let rulesLog = ''; const lenW1 = Math.abs(w1 - x); const lenW3 = Math.abs(w3 - w2); const w2RetracedW1 = isUp ? (w2 < x) : (w2 > x); if (w2RetracedW1) { rulesLog += '❌ Fala 2 zniosła więcej niż 100% Fali 1. (Złamanie reguły Elliotta)<br>'; } else { score += 2; rulesLog += '✅ Fala 2 zatrzymała się nad/pod początkiem Fali 1. (+2 pkt)<br>'; } if (lenW3 <= lenW1 * 0.98) { rulesLog += '⚠️ Fala 3 jest krótsza od Fali 1. Pamiętaj, że Fala 5 nie będzie mogła być krótsza od Fali 3.<br>'; } else { score += 1; rulesLog += '✅ Fala 3 jest dłuższa lub równa Fali 1. (+1 pkt)<br>'; } const overlap = isUp ? (w4 <= w1) : (w4 >= w1); if (overlap) { rulesLog += '❌ Fala 4 wkroczyła w terytorium Fali 1. (Złamanie standardowego impulsu - może być klin końńcowy)<br>'; } else { score += 2; rulesLog += '✅ Fala 4 nie zachodzi na Falę 1. Klasyczny impuls. (+2 pkt)<br>'; } const color = score === 5 ? 'var(--success)' : (score >= 3 ? '#fcd535' : 'var(--danger)'); document.getElementById('ew-score-text').innerHTML = `<span style="color:${color}; font-weight:bold;">${score} / ${maxScore} Pkt</span>`; document.getElementById('ew-rules-list').innerHTML = rulesLog; if (score >= 2) { document.getElementById('ew-projections').style.display = 'grid'; const w1ToW3Dist = Math.abs(w3 - x); const w5_target1 = isUp ? w4 + lenW1 : w4 - lenW1; const w5_target2 = isUp ? w4 + (w1ToW3Dist * 0.618) : w4 - (w1ToW3Dist * 0.618); const avgW5 = (w5_target1 + w5_target2) / 2; document.getElementById('ew-p5').innerText = avgW5.toFixed(2) + ' $'; const targetA = w4; document.getElementById('ew-pa').innerText = targetA.toFixed(2) + ' $'; const distA = Math.abs(avgW5 - targetA); const targetB = isUp ? targetA + (distA * 0.5) : targetA - (distA * 0.5); document.getElementById('ew-pb').innerText = targetB.toFixed(2) + ' $'; const targetC = isUp ? targetB - distA : targetB + distA; document.getElementById('ew-pc').innerText = targetC.toFixed(2) + ' $'; } else { document.getElementById('ew-projections').style.display = 'none'; } }
        function calculateRGR(e) { e.preventDefault(); const type = document.getElementById('rgr-type').value; const ls = parseFloat(document.getElementById('rgr-ls').value); const ln = parseFloat(document.getElementById('rgr-ln').value); const h = parseFloat(document.getElementById('rgr-h').value); const rn = parseFloat(document.getElementById('rgr-rn').value); const rs = parseFloat(document.getElementById('rgr-rs').value); let bp = parseFloat(document.getElementById('rgr-bp').value); if(isNaN(bp)) bp = rn; const isRGR = type === 'RGR'; let isValid = true; let reason = ''; if (isRGR) { if (h <= ls || h <= rs) { isValid = false; reason += '❌ Głowa RGR musi być wyżej niż ramiona.<br>'; } else reason += '✅ Głowa (wyżej).<br>'; } else { if (h >= ls || h >= rs) { isValid = false; reason += '❌ Głowa oRGR musi być niżej.<br>'; } else reason += '✅ Głowa (niżej).<br>'; } const shoulderDiff = Math.abs(ls - rs) / ls * 100; if (shoulderDiff > 15) { reason += `⚠️ Prawe ramię różni się od lewego (${shoulderDiff.toFixed(1)}%).<br>`; } else { reason += '✅ Ramiona na zbieżnym poziomie.<br>'; } const neckSlope = isRGR ? (rn - ln) : (ln - rn); if (isValid) { document.getElementById('rgr-valid-text').innerHTML = `<span style="color:var(--success);">Prawidłowy model</span>`; document.getElementById('rgr-targets').style.display = 'grid'; const neckAvg = (ln + rn) / 2; const headHeight = Math.abs(h - neckAvg); const target = isRGR ? bp - headHeight : bp + headHeight; document.getElementById('rgr-angle').innerText = neckSlope === 0 ? "Płaski" : (neckSlope > 0 ? "Rosnący" : "Spadkowy"); document.getElementById('rgr-height').innerText = headHeight.toFixed(2) + ' $'; document.getElementById('rgr-target').innerText = target.toFixed(2) + ' $'; } else { document.getElementById('rgr-valid-text').innerHTML = `<span style="color:var(--danger);">Złamane reguły</span>`; document.getElementById('rgr-targets').style.display = 'none'; } document.getElementById('rgr-valid-desc').innerHTML = reason; }

        // Utils
        function getTradingViewLink(ticker) { if (!ticker) return '#'; const cleanTicker = ticker.trim().toUpperCase(); const LAYOUT_ID = 'k5llKflB'; const baseUrl = LAYOUT_ID ? `https://www.tradingview.com/chart/${LAYOUT_ID}/` : 'https://www.tradingview.com/chart/'; if (cleanTicker.includes(':')) { return `${baseUrl}?symbol=${encodeURIComponent(cleanTicker)}`; } const nasdaqTickers = ['AAPL', 'TSLA', 'MSFT', 'AMZN', 'NVDA', 'META', 'GOOGL', 'GOOG', 'NFLX', 'AMD', 'INTC', 'QQQ']; const nyseTickers = ['SPY', 'BRK.A', 'BRK.B', 'DIS', 'NIO', 'BABA', 'AMC', 'GME', 'JPM', 'V', 'MA']; let exchange = ''; if (nasdaqTickers.includes(cleanTicker)) { exchange = 'NASDAQ:'; } else if (nyseTickers.includes(cleanTicker)) { exchange = 'NYSE:'; } else if (cleanTicker.endsWith('USDT') || cleanTicker.endsWith('BTC') || cleanTicker.endsWith('ETH')) { exchange = 'BINANCE:'; } return `${baseUrl}?symbol=${encodeURIComponent(exchange + cleanTicker)}`; }
        function getCurrencyForFrontend(ticker) { if (!ticker) return 'USD'; const t = ticker.toUpperCase(); if (t.includes('GPW:') || t.endsWith('.WA')) return 'PLN'; if (t.includes('XETR:') || t.endsWith('.DE')) return 'EUR'; return 'USD'; }
        function calculateTradeStats(item) { try { const isClosed = (item.status === 'CLOSED' || item.sell_date != null); const mod = ['DBR','RBR'].includes(item.direction) ? 1 : -1; const tm = tickerDataArray.find(t => t.ticker === item.ticker); const buyPrice = parseFloat(item.buy_price) || 0; let cp = buyPrice; if (isClosed && item.sell_price) { cp = parseFloat(item.sell_price); } else if (tm && tm.price) { cp = parseFloat(tm.price); } const spent = parseFloat(item.spent) || 0; const lev = parseInt(item.leverage) || 1; const val = spent * lev; const cfdCost = parseFloat(item.cfd_cost) || 0; const div = parseFloat(item.dividend) || 0; let prof = 0; if (buyPrice !== 0) { prof = (val * (((cp - buyPrice) / buyPrice) * mod)) + div - cfdCost; } const usedFx = parseFloat(isClosed ? (item.sell_fx_rate || item.buy_fx_rate || 1) : (item.buy_fx_rate || 1)); const profPln = prof * usedFx; const valPln = val * usedFx; const tp = parseFloat(item.tp) || 0; const sl = parseFloat(item.sl) || 0; let rr = 0; if (buyPrice - sl !== 0) { rr = ((tp - buyPrice) * mod) / ((buyPrice - sl) * mod); } let prog = 0; if (tp - buyPrice !== 0) { prog = ((cp - buyPrice) * mod) / ((tp - buyPrice) * mod); } let dsl = sl; if (prog >= 1) dsl = tp; else if (prog >= 0.5) dsl = buyPrice + ((tp - buyPrice) * (prog - 0.2)); let pd = prog * 100; let pc = 'var(--success)'; if (pd < 0) { pc = 'var(--danger)'; if (buyPrice - sl !== 0) { pd = Math.abs(((cp - buyPrice) * mod) / ((buyPrice - sl) * mod)) * 100; } else { pd = 0; } } if (pd > 100) pd = 100; return { isClosed, cp, val, prof, profPln, rr, prog, dsl, pd, pc, valPln, spentPln: spent * usedFx }; } catch (error) { return { isClosed: false, cp:0, val:0, prof:0, profPln:0, rr:0, prog:0, dsl:0, pd:0, pc:'gray', valPln:0, spentPln:0 }; } }

        // Modal functions
        function openCloseModal(id) { document.getElementById('sell-modal').style.display = 'flex'; document.getElementById('sell-trade-id').value = id; document.getElementById('sell-date').valueAsDate = new Date(); document.getElementById('sell-price').value = ''; document.getElementById('sell-fraction').value = '1'; const trade = allTradesData.find(t => t.id === id); if(trade && trade.leverage > 1) { document.getElementById('sell-cfd-group').style.display = 'block'; document.getElementById('sell-cfd-cost').value = '0'; } else { document.getElementById('sell-cfd-group').style.display = 'none'; document.getElementById('sell-cfd-cost').value = '0'; } }
        function closeSellModal() { document.getElementById('sell-modal').style.display = 'none'; }
        async function confirmSell() { const id = document.getElementById('sell-trade-id').value; const price = parseFloat(document.getElementById('sell-price').value); const date = document.getElementById('sell-date').value; const cfdCost = parseFloat(document.getElementById('sell-cfd-cost').value) || 0; const fracStr = document.getElementById('sell-fraction').value.trim(); if(!price || isNaN(price)) return alert('Błąd ceny!'); let fraction = 1.0; if(fracStr.includes('%')) { fraction = parseFloat(fracStr.replace('%', '')) / 100.0; } else if(fracStr.includes('/')) { const parts = fracStr.split('/'); fraction = parseFloat(parts[0]) / parseFloat(parts[1]); } else { let parsed = parseFloat(fracStr); if (parsed > 1.0) fraction = parsed / 100.0; else fraction = parsed; } try { await fetch(`${API_BASE_URL}/api/trades/close`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id: id, fraction: fraction, sell_price: price, sell_date: date, cfd_cost: cfdCost }) }); closeSellModal(); fetchTradesEntries(); } catch(e) {} }

        async function loadDailyBriefs() { try { const response = await fetch(`${API_BASE_URL}/api/blog/briefs`); const data = await response.json(); const container = document.getElementById('dailybrief-carousel'); container.innerHTML = ''; if(Array.isArray(data)) { data.forEach(item => { container.innerHTML += `<div class="brief-card"><h4>${item.title}</h4><div class="brief-text">${item.summary}</div><div class="brief-card-footer"><a href="${item.url}" target="_blank" class="brief-link">Oryginalny wpis 🔗</a></div></div>`; }); } } catch (error) {} }
        async function loadServiceModule() { if(allTradesData.length === 0) { try { const res = await fetch(`${API_BASE_URL}/api/trades/entries`); allTradesData = await res.json() || []; } catch(e) {} } const openTrades = allTradesData.filter(t => t.status === 'OPEN'); const select = document.getElementById('div-trade-id'); select.innerHTML = '<option value="">Wybierz otwartą pozycję...</option>'; openTrades.forEach(t => { select.innerHTML += `<option value="${t.id}">ID: #${t.id} | ${t.ticker} (${t.direction})</option>`; }); document.getElementById('div-date').valueAsDate = new Date(); }
        async function addDeposit(e) { e.preventDefault(); const amt = document.getElementById('dep-amt').value; const d = document.getElementById('dep-date').value; const cur = document.getElementById('dep-cur').value; try { await fetch(`${API_BASE_URL}/api/portfolio/deposits/add`,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({amount:amt, date:d, currency:cur}) }); document.getElementById('dep-amt').value = ''; initSummaryModule(); } catch(err) {} }
        async function deleteDeposit(id) { if(!confirm("Na pewno usunąć?")) return; try { await fetch(`${API_BASE_URL}/api/portfolio/deposits/delete`,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id}) }); initSummaryModule(); } catch(e) {} }
        async function addDividend(e) { e.preventDefault(); const tid = document.getElementById('div-trade-id').value; const date = document.getElementById('div-date').value; const amt = document.getElementById('div-amount').value; try { await fetch(`${API_BASE_URL}/api/trades/dividend/add`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({trade_id: parseInt(tid), dividend_date: date, amount: parseFloat(amt)}) }); document.getElementById('div-amount').value = ''; fetchTradesEntries(); alert("Dywidenda dodana!"); } catch(err) {} }
        async function forceAlertsCheck() { const out = document.getElementById('service-output'); out.style.display = 'block'; out.innerHTML = '⏳ Uruchamianie silnika alertów...'; try { const res = await fetch(`${API_BASE_URL}/api/cron/check-alerts`); const result = await res.json(); out.innerHTML = `✅ <strong>Gotowe.</strong> Aktywowane: ${result.alerts_triggered || 0}`; } catch(e) { out.innerHTML = `❌ Błąd.`; } }
        async function forceCronPricesUpdate() { const out = document.getElementById('service-output'); out.style.display = 'block'; out.innerHTML = '⏳ Pobieranie z Yahoo...'; try { const res = await fetch(`${API_BASE_URL}/api/cron/update-prices`); const result = await res.json(); out.innerHTML = `✅ <strong>Zaktualizowano.</strong> Tickerów: ${result.updated_tickers || 0}`; } catch(e) { out.innerHTML = `❌ Błąd.`; } }

        openDashboard();
